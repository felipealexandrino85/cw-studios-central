<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conectar TikTok · CW Studios</title>
<style>
  :root { --bg: #f3edfb; --card: #fff; --fg: #241b3a; --dim: #4e4b66; --brand: #7c3aed; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 Inter, system-ui, sans-serif; padding: 16px; }
  main { background: var(--card); border-radius: 20px; padding: 28px; max-width: 520px; width: 100%; box-shadow: 0 10px 30px rgba(89, 50, 122, .12); }
  h1 { margin: 0 0 8px; font-size: 22px; } p { color: var(--dim); }
  code { display: block; word-break: break-all; background: #f7f3fd; border: 1px solid #e5dcf3; border-radius: 12px; padding: 14px; font-size: 14px; }
  button { margin-top: 12px; border: 0; border-radius: 99px; padding: 10px 20px; background: var(--brand); color: #fff; font-weight: 700; cursor: pointer; }
</style></head>
<body><main>
  <h1>Conectar o TikTok ao publicador</h1>
  <p id="msg">Copie o código abaixo e cole no terminal, onde o assistente está esperando.</p>
  <code id="codigo">…</code>
  <button id="copiar" type="button">Copiar código</button>
</main>
<script>
  const q = new URLSearchParams(location.search), codigo = q.get("code"), erro = q.get("error_description") || q.get("error");
  document.getElementById("codigo").textContent = codigo || "(nenhum código)";
  if (!codigo) document.getElementById("msg").textContent = erro ? "O TikTok não autorizou: " + erro : "Abra esta página pelo assistente de conexão.";
  document.getElementById("copiar").onclick = async (ev) => {
    try { await navigator.clipboard.writeText(codigo || ""); ev.target.textContent = "Copiado"; }
    catch { getSelection().selectAllChildren(document.getElementById("codigo")); ev.target.textContent = "Selecionado: use ⌘C"; }
  };
</script>
</body></html>
